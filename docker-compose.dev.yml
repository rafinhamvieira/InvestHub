# Stack de desenvolvimento: apenas banco e cache, com portas expostas na máquina local.
# A aplicação roda fora do Docker com `npm run dev` (hot reload).
# Para produção, use o docker-compose.yml (ver DEPLOY.md).

name: investhub-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-investhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-investhub}
      POSTGRES_DB: ${POSTGRES_DB:-investhub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-investhub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:

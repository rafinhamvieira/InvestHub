name: investhub

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-investhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-investhub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-investhub} -d ${POSTGRES_DB:-investhub}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [investhub_net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [investhub_net]

  migrate:
    build:
      context: .
      target: builder
    # Binário local pelo mesmo motivo do Dockerfile: migração não pode depender de DNS.
    command: sh -c "./node_modules/.bin/prisma migrate deploy"
    env_file: .env
    # Bind mount para que migrações geradas no servidor (prisma migrate dev) persistam no host.
    volumes:
      - ./prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    networks: [investhub_net]

  app:
    build:
      context: .
      target: runner
      args:
        # Precisa chegar no build, não só no runtime: as páginas públicas são
        # pré-renderizadas e gravam nelas o endereço das imagens de pré-visualização.
        APP_URL: ${APP_URL:?defina APP_URL no .env}
    restart: unless-stopped
    env_file: .env
    environment:
      # Mesma pasta do serviço `backup`: o painel lista os dumps automáticos e escreve os
      # gerados sob demanda no mesmo lugar.
      BACKUP_DIR: /backups
      # O log em arquivo existe para sobreviver à recriação do container — que é justamente
      # quando alguém quer saber o que aconteceu antes. O stdout continua saindo igual.
      LOG_DIR: /logs
    volumes:
      - ./backups:/backups
      # Precisa ser gravável pelo uid 1001 (o usuário da aplicação): `chown 1001:1001 logs`.
      # Sem isso o sink se desliga sozinho e o painel avisa, em vez de derrubar a aplicação.
      - ./logs:/logs
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Usa o próprio node (fetch nativo) em vez de wget: não depende de binário externo
    # e faz um GET de verdade, igual ao que o navegador faz.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [investhub_net]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?defina APP_DOMAIN no .env}
      # URL pública completa (com porta, se houver) — usada no redirect de HTTP para HTTPS.
      APP_URL: ${APP_URL:?defina APP_URL no .env}
    volumes:
      - ./docker/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    ports:
      # HTTP_PORT só é útil para validação HTTP-01 e para redirecionar quem digita http://.
      # Com a porta 80 bloqueada pelo provedor, ela simplesmente não recebe tráfego externo.
      - "${HTTP_PORT:-80}:80"
      # Porta HTTPS publicada no host. Use 443 quando ela estiver liberada; caso contrário,
      # defina HTTPS_PORT com a porta que o roteador encaminha (ex: 8080) e inclua-a em APP_URL.
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - app
    # Renderizamos o template explicitamente: o entrypoint da imagem só faz isso quando o
    # comando começa com "nginx", e aqui ele começa com "/bin/sh" (por causa do laço de reload).
    # Listar as variáveis no envsubst também garante que $host, $remote_addr etc. fiquem intactos.
    # O reload a cada 6h adota certificados renovados sem derrubar o serviço.
    command:
      - /bin/sh
      - -c
      - |
        set -e
        envsubst '$$APP_DOMAIN $$APP_URL' \
          < /etc/nginx/templates/default.conf.template \
          > /etc/nginx/conf.d/default.conf
        nginx -t
        while :; do sleep 6h & wait $${!}; nginx -s reload; done &
        exec nginx -g 'daemon off;'
    networks: [investhub_net]

  # Renovação automática do certificado (checa a cada 12h; só renova perto do vencimento).
  # O certbot reutiliza o método de validação registrado na emissão inicial — webroot ou
  # os hooks DNS do DuckDNS —, então o mesmo serviço atende aos dois modos.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    environment:
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:-}
      DUCKDNS_PROPAGATION_SECONDS: ${DUCKDNS_PROPAGATION_SECONDS:-30}
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_logs:/var/log/letsencrypt
      - certbot_www:/var/www/certbot
      - ./docker/hooks:/hooks:ro
    entrypoint:
      - /bin/sh
      - -c
      - "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"

  # Job agendado: sincroniza cotações/fundamentos e avalia alertas.
  #
  # Atenção à cota do provedor: no plano gratuito da brapi cada ativo consome uma
  # requisição por ciclo. Com 20 ativos e intervalo de 30 min, são ~960 requisições/dia.
  # Aumente SYNC_INTERVAL_SECONDS se estiver perto do limite do seu plano.
  scheduler:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-1800}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Scheduler iniciado — sync a cada $${SYNC_INTERVAL_SECONDS}s";
        while true; do
          sleep "$${SYNC_INTERVAL_SECONDS}";
          curl -s -m 290 -X POST -H "x-cron-secret: $${CRON_SECRET}" http://app:3000/api/market/sync \
            || echo "sync falhou; nova tentativa no próximo ciclo";
        done
    networks: [investhub_net]

  # Backup do banco. Roda uma vez ao subir e depois a cada BACKUP_INTERVAL_SECONDS.
  #
  # Dump vai para ./backups no host, fora dos volumes do Docker de propósito: backup que
  # mora no mesmo volume que o banco não sobrevive ao acidente que ele deveria cobrir.
  # Arquivos mais antigos que BACKUP_RETENTION_DAYS são apagados a cada rodada.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    # Mesmo uid do processo da aplicação: os dumps automáticos precisam ser legíveis pelo
    # painel administrativo, e os gerados por lá, graváveis nesta mesma pasta.
    user: "1001:1001"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_USER: ${POSTGRES_USER:-investhub}
      POSTGRES_DB: ${POSTGRES_DB:-investhub}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Backup iniciado — a cada $${BACKUP_INTERVAL_SECONDS}s, mantendo $${BACKUP_RETENTION_DAYS} dias";
        while true; do
          FILE="/backups/investhub-$$(date +%Y%m%d-%H%M).sql.gz";
          if pg_dump -h postgres -U "$${POSTGRES_USER}" "$${POSTGRES_DB}" | gzip > "$$FILE"; then
            echo "backup ok: $$FILE ($$(du -h "$$FILE" | cut -f1))";
          else
            echo "BACKUP FALHOU em $$(date -Iseconds)";
            rm -f "$$FILE";
          fi;
          find /backups -name 'investhub-*.sql.gz' -mtime +$${BACKUP_RETENTION_DAYS} -delete;
          sleep "$${BACKUP_INTERVAL_SECONDS}";
        done
    networks: [investhub_net]

  # Administração do banco — perfil "dev". Publicado só em 127.0.0.1: acesse via túnel SSH
  # (ssh -L 8080:localhost:8080 usuario@servidor), nunca exposto à internet.
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - postgres
    networks: [investhub_net]
    profiles: ["dev"]

networks:
  investhub_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  certbot_conf:
  certbot_www:
  certbot_logs:

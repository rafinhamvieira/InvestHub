# Configuração mínima usada APENAS durante a emissão inicial do certificado.
# Sobe um nginx descartável na porta 80 para responder ao desafio HTTP-01 do Let's Encrypt,
# antes de os arquivos .pem existirem (o nginx de produção não inicia sem eles).
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
